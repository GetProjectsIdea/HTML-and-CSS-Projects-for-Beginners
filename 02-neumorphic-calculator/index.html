<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calc-wrapper">
    <div class="display" id="display">0</div>
    <div class="grid">
      <button class="btn fn" data-action="clear">AC</button>
      <button class="btn fn" data-action="toggle-sign">±</button>
      <button class="btn fn" data-action="percent">%</button>
      <button class="btn op" data-action="div">÷</button>
      <button class="btn num">7</button>
      <button class="btn num">8</button>
      <button class="btn num">9</button>
      <button class="btn op" data-action="mul">×</button>
      <button class="btn num">4</button>
      <button class="btn num">5</button>
      <button class="btn num">6</button>
      <button class="btn op" data-action="sub">−</button>
      <button class="btn num">1</button>
      <button class="btn num">2</button>
      <button class="btn num">3</button>
      <button class="btn op" data-action="add">+</button>
      <button class="btn num zero">0</button>
      <button class="btn num">.</button>
      <button class="btn eq" data-action="eq">=</button>
    </div>
  </div>
  <script>
    let current = '0';
    let prev = null;
    let op = null;
    let resetOnNext = false;
    const disp = document.getElementById('display');

    function update() { disp.textContent = current; }

    document.querySelectorAll('.num').forEach(b => {
      b.addEventListener('click', () => {
        const d = b.textContent;
        if (resetOnNext) { current = d; resetOnNext = false; }
        else { current = current === '0' ? d : current + d; }
        update();
      });
    });

    document.querySelectorAll('.fn').forEach(b => {
      b.addEventListener('click', () => {
        const act = b.dataset.action;
        if (act === 'clear') { current = '0'; prev = null; op = null; }
        if (act === 'toggle-sign') { current = String(-parseFloat(current)); }
        if (act === 'percent') { current = String(parseFloat(current) / 100); }
        update();
      });
    });

    document.querySelectorAll('.op').forEach(b => {
      b.addEventListener('click', () => {
        prev = parseFloat(current);
        op = b.dataset.action;
        resetOnNext = true;
      });
    });

    document.querySelector('.eq').addEventListener('click', () => {
      if (op && prev !== null) {
        const cur = parseFloat(current);
        let res = 0;
        if (op === 'add') res = prev + cur;
        if (op === 'sub') res = prev - cur;
        if (op === 'mul') res = prev * cur;
        if (op === 'div') res = cur !== 0 ? prev / cur : 'Error';
        current = String(res);
        op = null;
        prev = null;
        resetOnNext = true;
        update();
      }
    });
  </script>
</body>
</html>
