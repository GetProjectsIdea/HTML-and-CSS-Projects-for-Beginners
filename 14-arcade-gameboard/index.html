<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playable Snake Arcade Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="arcade-unit">
    <div class="header-bar">
      <span>SCORE: <strong id="score">0</strong></span>
      <span>USE ARROWS / WASD</span>
    </div>
    <canvas id="game" width="300" height="300"></canvas>
  </div>
  <script>
    const cvs = document.getElementById('game');
    const ctx = cvs.getContext('2d');
    const grid = 15;
    let snake = [{x: 150, y: 150}];
    let dx = grid, dy = 0;
    let food = {x: 60, y: 60};
    let score = 0;

    function loop() {
      setTimeout(() => {
        requestAnimationFrame(loop);
      }, 100);

      const head = {x: snake[0].x + dx, y: snake[0].y + dy};
      if (head.x >= cvs.width) head.x = 0;
      if (head.x < 0) head.x = cvs.width - grid;
      if (head.y >= cvs.height) head.y = 0;
      if (head.y < 0) head.y = cvs.height - grid;

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        food = {
          x: Math.floor(Math.random() * (cvs.width / grid)) * grid,
          y: Math.floor(Math.random() * (cvs.height / grid)) * grid
        };
      } else {
        snake.pop();
      }

      ctx.fillStyle = '#021a08';
      ctx.fillRect(0, 0, cvs.width, cvs.height);

      ctx.fillStyle = '#ef4444';
      ctx.fillRect(food.x, food.y, grid - 2, grid - 2);

      ctx.fillStyle = '#22c55e';
      snake.forEach(p => ctx.fillRect(p.x, p.y, grid - 2, grid - 2));
    }
    window.addEventListener('keydown', e => {
      if ((e.key === 'ArrowUp' || e.key === 'w') && dy === 0) { dx = 0; dy = -grid; }
      if ((e.key === 'ArrowDown' || e.key === 's') && dy === 0) { dx = 0; dy = grid; }
      if ((e.key === 'ArrowLeft' || e.key === 'a') && dx === 0) { dx = -grid; dy = 0; }
      if ((e.key === 'ArrowRight' || e.key === 'd') && dx === 0) { dx = grid; dy = 0; }
    });
    requestAnimationFrame(loop);
  </script>
</body>
</html>
